services:
  - type: web
    name: talentlens-resume-screening
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-20b
      - key: NVIDIA_API_KEY
        sync: false
